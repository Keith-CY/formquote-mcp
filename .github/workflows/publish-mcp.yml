# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# as io.github.Keith-CY/formquote-mcp, signed in with GitHub OIDC: no secrets needed.
# Runs on a version tag (v1.0.1 …) or by hand. Bump "version" in server.json first;
# a version can't be published twice.
name: publish-mcp

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Install mcp-publisher
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
